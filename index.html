<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Form Validation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Form Validation</h1>
  <form id="validationForm" novalidate>
    <label for="name">Name (2-20 characters):</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="comment">Comment (10-200 characters):</label>
    <textarea id="comment" name="comment" rows="5" required></textarea>
    <div class="char-counter" id="charCounter">0/200</div>

    <div id="message"></div>
    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <script src="./script.js">  </script>
</body>

</html>
